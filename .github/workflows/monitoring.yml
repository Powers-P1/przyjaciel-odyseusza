name: Kontrola produkcji bez wysyłania poczty

on:
  schedule:
    - cron: '17,47 * * * *'
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-readonly-monitor
  cancel-in-progress: false

jobs:
  public-checks:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule != '17 6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: node tools/monitor.mjs
  registry-expiry:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: node tools/domain-monitor.mjs
