# Publikujemy wyłącznie wybraną wersję A z commitu, który przeszedł QA.
name: QA i publikacja testowa

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"

# Cały przebieg Pages (SHA → QA → deploy → smoke) jest serializowany.
# PR-y mają osobne grupy i nie publikują podglądu.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('qa-pr-{0}', github.event.pull_request.number) || 'github-pages-release' }}
  cancel-in-progress: false

jobs:
  snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    outputs:
      sha: ${{ github.sha }}
      publish: ${{ steps.refs.outputs.publish }}
      base-url: ${{ steps.refs.outputs.base-url }}
    steps:
      - uses: actions/checkout@v7
      - id: pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
      - name: Ustal publikację wybranej wersji A
        id: refs
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref_name }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const publish = process.env.EVENT_NAME !== 'pull_request' && process.env.EVENT_REF === 'main';
          const baseUrl = (process.env.PAGES_BASE_URL || 'https://powers-p1.github.io/przyjaciel-odyseusza').replace(/\/+$/, '');
          if (!new URL(baseUrl).hostname.endsWith('.github.io')) throw new Error('Pipeline demonstracyjny publikuje wyłącznie na github.io.');
          appendFileSync(process.env.GITHUB_OUTPUT, [
            'publish=' + publish,
            'base-url=' + baseUrl,
            '',
          ].join('\n'));
          NODE

  qa:
    needs: snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.snapshots.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build i zgodność wygenerowanych plików
        run: |
          npm run build
          git diff --exit-code -- public || (echo "Uruchom npm run build i dołącz aktualne public/ do commitu." && exit 1)
      - name: Walidacja HTML, CSS, CSP i typografii
        run: npm run validate
      - name: Testy funkcji formularza z atrapami dostawców
        run: npm run test:backend
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Testy przeglądarek i dostępności
        run: npm test
      - name: Lighthouse (mediana z trzech przebiegów)
        env:
          LH_RUNS: 3
        run: |
          set -euo pipefail
          npx wrangler pages dev --port 8788 --ip 127.0.0.1 --log-level warn &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          npx wait-on http://127.0.0.1:8788/ --timeout 120000
          npm run lighthouse
      - name: Przygotuj podgląd A z przetestowanych plików
        env:
          STAGING_URL: ${{ needs.snapshots.outputs.base-url }}/
          BUILD_ID: ${{ needs.snapshots.outputs.sha }}
        run: |
          npm run build:staging
          test -f dist-gh/.nojekyll
          test -f dist-gh/.well-known/security.txt
      - uses: actions/upload-artifact@v7
        with:
          name: staging-A-${{ needs.snapshots.outputs.sha }}
          path: dist-gh
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: raporty-qa-A-${{ needs.snapshots.outputs.sha }}
          path: |
            playwright-report
            docs/lighthouse
          retention-days: 14

  staging:
    needs: [snapshots, qa]
    if: needs.snapshots.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    outputs:
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: staging-A-${{ needs.snapshots.outputs.sha }}
          path: dist-gh
      - name: Sprawdź artefakt wyłącznie wersji A
        run: |
          test -f dist-gh/index.html
          test ! -e dist-gh/wersja-b
          test ! -e dist-gh/wersja-c
          test ! -e dist-gh/wersje
          test -f dist-gh/.nojekyll
          test -f dist-gh/.well-known/security.txt
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-gh
          include-hidden-files: true
      - id: deploy
        uses: actions/deploy-pages@v5

  staging-smoke:
    needs: [snapshots, staging]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      STAGING_URL: ${{ needs.staging.outputs.url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.snapshots.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Czekaj na wdrożony commit w CDN (maksymalnie pięć minut)
        env:
          EXPECTED_SHA: ${{ needs.snapshots.outputs.sha }}
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "$STAGING_URL" | grep -Fq "build $EXPECTED_SHA"; then
              echo "CDN podaje oczekiwany commit $EXPECTED_SHA."
              exit 0
            fi
            sleep 5
          done
          echo "CDN nie podaje oczekiwanego commitu $EXPECTED_SHA."
          exit 1
      - name: Sprawdź opublikowaną wersję A testami z tego samego SHA
        run: npm run test:staging -- --project=chromium --project=mobile-chrome
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: raporty-staging-A-${{ needs.snapshots.outputs.sha }}
          path: playwright-report
          retention-days: 14
